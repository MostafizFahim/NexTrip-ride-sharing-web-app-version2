services:
  postgres:
    image: postgres:17-alpine
    container_name: nextrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextrip
    ports:
      - "5432:5432"
    volumes:
      - nextrip_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nextrip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  nextrip_postgres_data:
